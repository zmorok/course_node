name: workify

services:
  # Application data and initialize a new database once
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workify}
      POSTGRES_USER: ${POSTGRES_USER:-workify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set app password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Application API
  backend:
    container_name: backend
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: '3000'
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:-workify}
      PGUSER: workify_runtime
      PGPASSWORD: ${APP_DB_PASSWORD:?Set app password in .env}
      UPLOAD_DIR: /app/uploads
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set JWT secret in .env}
      AUTH_COOKIE_SECURE: '${AUTH_COOKIE_SECURE:-false}'
      AUTH_ACCESS_TTL_SECONDS: '${AUTH_ACCESS_TTL_SECONDS:-900}'
      AUTH_SESSION_TTL_DAYS: '${AUTH_SESSION_TTL_DAYS:-30}'
      HTTP_JSON_LIMIT_BYTES: '${HTTP_JSON_LIMIT_BYTES:-65536}'
      HTTP_TRUST_PROXY_HOPS: '1'
      PGPOOL_MAX: '${PGPOOL_MAX:-5}'
      PG_CONNECTION_TIMEOUT_MS: '${PG_CONNECTION_TIMEOUT_MS:-2000}'
      PG_IDLE_TIMEOUT_MS: '${PG_IDLE_TIMEOUT_MS:-10000}'
      PG_QUERY_TIMEOUT_MS: '${PG_QUERY_TIMEOUT_MS:-2000}'
      PG_STATEMENT_TIMEOUT_MS: '${PG_STATEMENT_TIMEOUT_MS:-2000}'
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)})
          .then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

  # Serve the React bundle and forward API requests to the backend
  proxy:
    container_name: proxy
    image: nginx:alpine
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:8080'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/bundle:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /usr/share/nginx/html/index.html &&
          wget -q -O /dev/null http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s
    restart: unless-stopped

# Keep database records and uploads when containers are recreated
volumes:
  postgres_data:
  uploads_data:
