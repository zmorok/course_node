user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Docker DNS: follow backend address changes after container recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream workify_api {
        zone workify_api 64k;
        server backend:3000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        etag off;
        if_modified_since off;

        # Backend allows a 10 MiB file; leave room for multipart headers.
        client_max_body_size 11m;

        location = /healthz {
            access_log off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok"}';
        }

        location ~ ^/api(?:/|$) {
            # No URI suffix: preserve /api and the original query string.
            proxy_pass http://workify_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            error_page 502 504 = @backend_unavailable;
        }

        location @backend_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 502 '{"status":"error","message":"Сервис временно недоступен"}';
        }

        location ~ /\. {
            return 404;
        }

        location ~ \.[^/]+$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
