name: workify

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workify}
      POSTGRES_USER: ${POSTGRES_USER:-workify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs to create .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-workify}
      PGUSER: ${POSTGRES_USER:-workify}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs to create .env}
    volumes:
      - ./database:/migrations:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/migrate.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "3000"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-workify}
      PGUSER: ${POSTGRES_USER:-workify}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-env.mjs to create .env}
      UPLOAD_DIR: /app/uploads
      HTTP_JSON_LIMIT_BYTES: "${HTTP_JSON_LIMIT_BYTES:-65536}"
      PGPOOL_MAX: "${PGPOOL_MAX:-5}"
      PG_CONNECTION_TIMEOUT_MS: "${PG_CONNECTION_TIMEOUT_MS:-2000}"
      PG_IDLE_TIMEOUT_MS: "${PG_IDLE_TIMEOUT_MS:-10000}"
      PG_QUERY_TIMEOUT_MS: "${PG_QUERY_TIMEOUT_MS:-2000}"
      PG_STATEMENT_TIMEOUT_MS: "${PG_STATEMENT_TIMEOUT_MS:-2000}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      PORT: "8080"
      BACKEND_URL: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
